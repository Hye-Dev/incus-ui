name: DCA Verification

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: dca-verification-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dca_check:
    name: Check DCA
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - name: Check DCA, report, and gate the PR head
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const marker = '<!-- dca-check-comment -->';
            const maxCommentLength = 60000;
            const maxDisplayedTrailers = 5;
            const actionsBot = Object.freeze({
              id: 41898282,
              login: 'github-actions[bot]',
              type: 'Bot',
            });
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const eventHeadSha = context.payload.pull_request.head.sha;
            const defaultBranch = context.payload.repository.default_branch;
            const dcaUrl = `https://github.com/${owner}/${repo}/blob/${defaultBranch}/docs/contributing/code/DCA.md`;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;

            function escapedScalar(value, maxLength = 300) {
              const escaped = String(value).replace(/[\u0000-\u001f\u007f`]/g, (character) => {
                if (character === '\n') return '\\n';
                if (character === '\r') return '\\r';
                if (character === '\t') return '\\t';
                if (character === '`') return '\\x60';
                return `\\u${character.charCodeAt(0).toString(16).padStart(4, '0')}`;
              });
              return escaped.length > maxLength ? `${escaped.slice(0, maxLength)}…` : escaped;
            }

            function inlineCode(value) {
              return `\`${escapedScalar(value)}\``;
            }

            function isActionsBotComment(comment) {
              return comment.user?.id === actionsBot.id &&
                comment.user?.login === actionsBot.login &&
                comment.user?.type === actionsBot.type;
            }

            function normalizedName(value) {
              return value.trim().replace(/\s+/g, ' ').toLowerCase();
            }

            function normalizedEmail(value) {
              return value.trim().toLowerCase();
            }

            async function setStatus(state, description) {
              await github.rest.repos.createCommitStatus({
                owner, repo, sha: eventHeadSha, state,
                context: 'DCA Verification', description, target_url: runUrl,
              });
            }

            async function findExistingComment() {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number, per_page: 100,
              });
              return comments.find((comment) =>
                isActionsBotComment(comment) && comment.body.includes(marker)
              );
            }

            function analyzeSignoff(commit) {
              const identities = [commit.commit.author, commit.commit.committer]
                .filter((identity) => identity?.name && identity?.email);
              const trailers = [...commit.commit.message.matchAll(
                /^Signed-off-by:[ \t]*([^<>\r\n]+?)[ \t]*<([^<>\r\n]+)>[ \t]*$/gmi
              )].map((match) => ({ name: match[1].trim(), email: match[2].trim() }));

              const matched = trailers.some((trailer) => identities.some((identity) =>
                normalizedName(trailer.name) === normalizedName(identity.name) &&
                normalizedEmail(trailer.email) === normalizedEmail(identity.email)
              ));
              return { matched, identities, trailers };
            }

            await setStatus('pending', 'Checking every PR commit for a matching DCA sign-off.');

            let passed = false;
            let failures = [];
            let skippedMergeCount = 0;
            try {
              const { data: pr } = await github.rest.pulls.get({
                owner, repo, pull_number: issue_number,
              });
              if (pr.state !== 'open' || pr.head.sha !== eventHeadSha) {
                core.notice('Skipping a stale DCA run because the PR head changed or the PR closed.');
                return;
              }

              const commits = await github.paginate(github.rest.pulls.listCommits, {
                owner, repo, pull_number: issue_number, per_page: 100,
              });

              if (pr.commits > 250) {
                failures.push({
                  kind: 'system',
                  message: `This PR has ${pr.commits} commits, but GitHub exposes at most 250 for verification. Please reduce the commit count.`,
                });
              } else if (commits.length !== pr.commits) {
                failures.push({
                  kind: 'system',
                  message: `GitHub reported ${pr.commits} commits, but only ${commits.length} could be retrieved. No partial DCA check is accepted.`,
                });
              }

              for (const commit of commits) {
                if (commit.parents.length > 1) {
                  skippedMergeCount++;
                  continue;
                }
                const analysis = analyzeSignoff(commit);
                if (!analysis.matched) {
                  failures.push({
                    kind: analysis.trailers.length === 0 ? 'missing' : 'mismatch',
                    sha: commit.sha.slice(0, 12),
                    expected: analysis.identities.map((identity) => `${identity.name} <${identity.email}>`),
                    found: analysis.trailers.slice(0, maxDisplayedTrailers)
                      .map((trailer) => `${trailer.name} <${trailer.email}>`),
                    omittedTrailers: Math.max(0, analysis.trailers.length - maxDisplayedTrailers),
                  });
                }
              }

              passed = failures.length === 0;
              await setStatus(
                passed ? 'success' : 'failure',
                passed ? 'All applicable PR commits have matching DCA sign-offs.' : 'One or more PR commits lack a matching DCA sign-off.'
              );
            } catch (err) {
              await setStatus('error', 'The DCA check could not complete. See the workflow logs.');
              core.setFailed(`DCA verification could not complete: ${err.message}`);
              return;
            }

            let existing;
            try {
              existing = await findExistingComment();
            } catch (err) {
              core.warning(`Could not list existing DCA comments: ${err.message}`);
            }

            if (passed) {
              if (existing) {
                try {
                  await github.rest.issues.updateComment({
                    owner, repo, comment_id: existing.id,
                    body: `${marker}\n### ✅ Thanks for agreeing to the DCA.`,
                  });
                } catch (err) {
                  core.warning(`Could not update the DCA comment: ${err.message}`);
                }
              }
              return;
            }

            const introLines = [
              marker,
              '### ❌ DCA Not Signed',
              '',
              `One or more commits haven't been signed to the Developer Contribution Agreement. Please review the [Developer Contribution Agreement](${dcaUrl}).`,
              '',
            ];
            function formatFailure(failure) {
              if (failure.kind === 'system') {
                return `- ${failure.message}`;
              }
              if (failure.kind === 'missing') {
                return `- Commit ${inlineCode(failure.sha)} has no Signed-off-by trailer. Expected ${failure.expected.map(inlineCode).join(' or ')}.`;
              }
              const omitted = failure.omittedTrailers > 0
                ? `; ${failure.omittedTrailers} additional trailer(s) omitted`
                : '';
              return `- Commit ${inlineCode(failure.sha)} has a Signed-off-by identity mismatch. Expected ${failure.expected.map(inlineCode).join(' or ')}; found ${failure.found.map(inlineCode).join(', ')}${omitted}.`;
            }

            const mergeLines = skippedMergeCount > 0
              ? ['', `ℹ️ ${skippedMergeCount} merge commit(s) were excluded; all non-merge commits exposed by this PR were checked individually.`]
              : [];
            const remediationLines = [
              '',
              '<details>',
              '<summary>✍️ I\'ve read and agree to the Developer Contribution Agreement. How do I sign off?</summary>',
              '',
              "A sign-off, in the form of a `Signed-off-by: [Your Full Name] <[your primary email address]>` line included in the commit message (with the bracketed fields replaced by your own identifying information, and the brackets themselves omitted), constitutes your acceptance of, and agreement to be bound by, the Developer Contribution Agreement.",
              '',
              "You must use your real personal identifying information. Make sure it matches your Git `user.name`/`user.email` config and that these are associated with your GitHub account.",
              '',
              '**If your branch has a single commit**, amend it and force-push:',
              '```bash',
              'git commit --amend --signoff',
              'git push --force-with-lease',
              '```',
              '',
              '**If your branch has multiple commits**, sign off all of them at once and force-push:',
              '```bash',
              'git rebase HEAD~<number-of-commits> --signoff',
              'git push --force-with-lease',
              '```',
              'Replace `<number-of-commits>` with how many commits are in this PR (or rebase onto the base branch, e.g. `git rebase --signoff origin/main`).',
              '',
              '**Going forward**, sign off new commits as you make them:',
              '```bash',
              'git commit -s -m "Your commit message"',
              '```',
              '',
              'This adds a trailer to your commit message in the form:',
              '```',
              'Signed-off-by: Your Name <your.email@example.com>',
              '```',
              '</details>',
              '',
              "Once you've pushed the fix, this check will re-run automatically.",
            ];
            const displayedFailures = [];
            for (const failure of failures) {
              const candidate = [...displayedFailures, formatFailure(failure)];
              const omittedCount = failures.length - candidate.length;
              const omissionLines = omittedCount > 0
                ? [`- … ${omittedCount} additional failure(s) omitted; see the workflow log.`]
                : [];
              const candidateBody = [
                ...introLines,
                ...candidate,
                ...omissionLines,
                ...mergeLines,
                ...remediationLines,
              ].join('\n');
              if (candidateBody.length > maxCommentLength) break;
              displayedFailures.push(candidate[candidate.length - 1]);
            }
            const omittedFailureCount = failures.length - displayedFailures.length;
            const body = [
              ...introLines,
              ...displayedFailures,
              ...(omittedFailureCount > 0
                ? [`- … ${omittedFailureCount} additional failure(s) omitted; see the workflow log.`]
                : []),
              ...mergeLines,
              ...remediationLines,
            ].join('\n');

            try {
              if (existing) {
                await github.rest.issues.updateComment({
                  owner, repo, comment_id: existing.id, body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner, repo, issue_number, body,
                });
              }
            } catch (err) {
              core.warning(`Could not post the DCA comment: ${err.message}`);
            }
            core.setFailed('One or more commits do not have a matching DCA sign-off.');
