name: REUSE Compliance Report

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: number
      head_sha:
        required: true
        type: string

permissions:
  actions: read
  pull-requests: write
  statuses: write

jobs:
  report:
    name: Report REUSE compliance
    runs-on: ubuntu-latest
    steps:
      - name: Download report artifact
        id: download
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reuse-report
          path: ${{ runner.temp }}/reuse-artifact

      - name: Evaluate REUSE compliance and comment on PR
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/reuse-artifact
          HEAD_SHA: ${{ inputs.head_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            const crypto = require('crypto');
            const fs = require('fs');
            const path = require('path');
            const marker = '<!-- reuse-check-comment -->';
            const MAX_COMMENT_LENGTH = 60000;
            const MAX_DISPLAY_LENGTH = 500;
            const MAX_BLOCK_LENGTH = 12000;
            const ACTIONS_BOT = Object.freeze({
              id: 41898282,
              login: 'github-actions[bot]',
              type: 'Bot',
            });
            const { owner, repo } = context.repo;
            const prNumber = Number(process.env.PR_NUMBER);
            const headSha = process.env.HEAD_SHA;
            if (!Number.isInteger(prNumber) || prNumber < 1 || !/^[0-9a-f]{40}$/.test(headSha)) {
              throw new Error('The trusted caller supplied invalid PR metadata.');
            }
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const defaultBranch = context.payload.repository.default_branch;
            const guidelinesUrl = `https://github.com/${owner}/${repo}/blob/${defaultBranch}/docs/contributing/code/guidelines.md`;
            const artifactDir = process.env.ARTIFACT_DIR;

            function escapedScalar(value, maxLength = MAX_DISPLAY_LENGTH) {
              const escaped = String(value).replace(/[\u0000-\u001f\u007f`]/g, (character) => {
                if (character === '\n') return '\\n';
                if (character === '\r') return '\\r';
                if (character === '\t') return '\\t';
                if (character === '`') return '\\x60';
                return `\\u${character.charCodeAt(0).toString(16).padStart(4, '0')}`;
              });
              return escaped.length > maxLength ? `${escaped.slice(0, maxLength)}…` : escaped;
            }

            function inlineCode(value, maxLength) {
              return `\`${escapedScalar(value, maxLength)}\``;
            }

            function fencedBlock(value) {
              const text = String(value).replace(/\r\n?/g, '\n');
              const longestRun = Math.max(2, ...(text.match(/`+/g) || []).map((run) => run.length));
              const fence = '`'.repeat(longestRun + 1);
              const bounded = text.length > MAX_BLOCK_LENGTH
                ? `${text.slice(0, MAX_BLOCK_LENGTH)}\n… truncated …`
                : text;
              return `${fence}\n${bounded}\n${fence}`;
            }

            function suggestionKey(filePath) {
              return crypto.createHash('sha256').update(filePath).digest('hex');
            }

            function hasSuggestionFenceConflict(value) {
              return /(^|\n)[ \t]{0,3}`{3,}/.test(value) || value.length > MAX_BLOCK_LENGTH;
            }

            function isActionsBotComment(comment) {
              return comment.user?.id === ACTIONS_BOT.id &&
                comment.user?.login === ACTIONS_BOT.login &&
                comment.user?.type === ACTIONS_BOT.type;
            }

            function boundedComment(body) {
              if (body.length <= MAX_COMMENT_LENGTH) return body;
              core.warning(`REUSE comment exceeded ${MAX_COMMENT_LENGTH} characters and was replaced with a bounded summary.`);
              return [
                marker,
                '### ⚠️ REUSE report was too large to display safely',
                '',
                `See the [workflow run](${runUrl}) for the status and scan artifact.`,
              ].join('\n');
            }

            // Bind the caller's event values back to the live PR. A superseded
            // run must never comment on or set a status for the new head.
            const { data: boundPr } = await github.rest.pulls.get({
              owner, repo, pull_number: prNumber,
            });
            if (
              boundPr.state !== 'open' ||
              boundPr.base.repo.full_name !== `${owner}/${repo}` ||
              boundPr.head.sha !== headSha
            ) {
              core.notice('Skipping a stale REUSE report because the PR head changed or the PR closed.');
              return;
            }

            async function setStatus(state, description) {
              await github.rest.repos.createCommitStatus({
                owner, repo, sha: headSha, state, context: 'REUSE Compliance', description, target_url: runUrl,
              });
            }

            async function upsertComment(issue_number, body) {
              body = boundedComment(body);
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number, per_page: 100,
              });
              const existing = comments.find((c) =>
                isActionsBotComment(c) && c.body.includes(marker)
              );
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number, body });
              }
            }

            async function clearOrLeaveSilent(issue_number) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number, per_page: 100,
              });
              const existing = comments.find((c) =>
                isActionsBotComment(c) && c.body.includes(marker)
              );
              if (existing) {
                await github.rest.issues.updateComment({
                  owner, repo, comment_id: existing.id,
                  body: `${marker}\n### ✅ REUSE Specification compliance check passed.`,
                });
              }
            }

            // Copyleft banned outright, regardless of LICENSES/
            // contents (a PR can't self-approve a banned license by adding both the
            // code and its license file in the same PR).
            const INCOMPATIBLE = new Set([
              'GPL-1.0-only', 'GPL-1.0-or-later', 'GPL-2.0-only', 'GPL-2.0-or-later', 'GPL-3.0-only', 'GPL-3.0-or-later',
              'GPL-1.0', 'GPL-1.0+', 'GPL-2.0', 'GPL-2.0+', 'GPL-3.0', 'GPL-3.0+',
              'LGPL-2.0-only', 'LGPL-2.0-or-later', 'LGPL-2.1-only', 'LGPL-2.1-or-later', 'LGPL-3.0-only', 'LGPL-3.0-or-later',
              'LGPL-2.0', 'LGPL-2.0+', 'LGPL-2.1', 'LGPL-2.1+', 'LGPL-3.0', 'LGPL-3.0+',
              'AGPL-1.0-only', 'AGPL-1.0-or-later', 'AGPL-3.0-only', 'AGPL-3.0-or-later',
              'AGPL-1.0', 'AGPL-3.0', 'AGPL-3.0+',
            ]);
            // Weak-copyleft: file-level share-alike obligations that are narrower
            // than GPL/LGPL/AGPL. Never blocks the PR, but always called out. Every
            // time it's used, not just on first use, since the obligation is a
            // per-file, ongoing one rather than a one-time compatibility judgment.
            const CAUTION = new Set([
              'MPL-1.0', 'MPL-1.1', 'MPL-2.0',
              'CDDL-1.0', 'CDDL-1.1',
              'EPL-1.0', 'EPL-2.0',
            ]);

            // --- 1. read what reuse-scan.yml captured ---
            let report;
            let licensesDirEntries = [];
            try {
              report = JSON.parse(fs.readFileSync(path.join(artifactDir, 'reuse-lint.json'), 'utf8'));
              const requiredFindingArrays = [
                'bad_licenses', 'deprecated_licenses', 'licenses_without_extension',
                'missing_copyright_info', 'missing_licenses', 'missing_licensing_info',
                'read_errors', 'unused_licenses',
              ];
              const validFiles = Array.isArray(report.files) && report.files.every((file) =>
                typeof file.path === 'string' &&
                Array.isArray(file.spdx_expressions) &&
                file.spdx_expressions.every((expression) =>
                  typeof expression.value === 'string' && typeof expression.is_valid === 'boolean'
                )
              );
              const validFindings =
                typeof report.non_compliant === 'object' &&
                report.non_compliant !== null &&
                requiredFindingArrays.every((key) =>
                  Array.isArray(report.non_compliant[key]) &&
                  report.non_compliant[key].every((value) => typeof value === 'string')
                );
              if (!validFiles || !validFindings) {
                throw new Error('The scan report has an invalid shape.');
              }
              licensesDirEntries = JSON.parse(
                fs.readFileSync(path.join(artifactDir, 'licenses_dir.json'), 'utf8')
              );
              if (!Array.isArray(licensesDirEntries) || !licensesDirEntries.every((entry) => typeof entry === 'string')) {
                throw new Error('The LICENSES directory listing has an invalid shape.');
              }
            } catch (err) {
              await setStatus('error', 'Could not read the scan report — check the workflow run logs.');
              await upsertComment(prNumber, [
                marker,
                '### ⚠️ REUSE Specification compliance check could not run',
                '',
                `Reading the scan report failed (${inlineCode(err.message)}). A maintainer needs to check the workflow run logs. This isn't something a contributor can fix by pushing code.`,
              ].join('\n'));
              return;
            }
            const issue_number = prNumber;

            // --- 2. changed files (PRs commonly exceed 100 — must paginate) ---
            const changedFiles = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: prNumber, per_page: 100,
            });
            const changedPaths = new Set(changedFiles.map((f) => f.filename));
            const changedLicenseIds = new Set(
              [...changedPaths]
                .filter((filePath) => path.posix.dirname(filePath) === 'LICENSES')
                .map((filePath) => path.posix.parse(filePath).name)
            );

            // --- 3. index files[] by path for cross-referencing ---
            const filesByPath = new Map(report.files.map((f) => [f.path, f]));

            // --- 4. tokenize an SPDX expression into candidate identifiers ---
            // Note: `WITH <exception>` clauses tokenize the exception id separately
            // (e.g. Classpath-exception-2.0), it lands in unknownFound, but the
            // base license id is still classified correctly.
            function tokenize(expr) {
              return expr
                .replace(/[()]/g, ' ')
                .split(/\s+/)
                .filter((t) => t && t !== 'AND' && t !== 'OR' && t !== 'WITH');
            }

            // --- 5. licenses declared by changed files (excluding project-native ones) ---
            const changedFileLicenses = new Map(); // identifier -> Set<path>
            for (const cf of changedFiles) {
              const f = filesByPath.get(cf.filename);
              if (!f) continue;
              for (const expr of f.spdx_expressions) {
                for (const id of tokenize(expr.value)) {
                  if (id === 'Apache-2.0') continue;
                  if (!changedFileLicenses.has(id)) changedFileLicenses.set(id, new Set());
                  changedFileLicenses.get(id).add(cf.filename);
                }
              }
            }

            // --- 6. classify each license found ---
            // "Compatible" is derived from LICENSES/ provenance, not a hardcoded
            // allow-list: a license already has an approved LICENSES/ file that
            // predates this PR means a maintainer reviewed it previously, and every
            // later use is recognized automatically. A PR introducing a license's
            // LICENSES/ file for the first time can't self-approve. It's flagged
            // as unknown (warn-only) for a maintainer to look at once; once merged,
            // future PRs using that license become "compatible" automatically.
            function licenseFileNameFor(id) {
              return licensesDirEntries.find((name) => path.parse(name).name === id);
            }

            const compatibleFound = [];
            const incompatibleFound = [];
            const unknownFound = [];
            const cautionFound = [];
            const licenseRefFound = [];
            for (const [id, paths] of changedFileLicenses) {
              // LicenseRef- identifiers are custom, non-SPDX-registered licenses —
              // there's no public registry to validate them against, so a
              // maintainer always has to read and approve the actual text.
              // Always warned on, every use, same as CAUTION: LICENSES/
              // provenance doesn't make a custom license any safer to
              // auto-trust just because it was used once before.
              if (id.startsWith('LicenseRef-')) {
                licenseRefFound.push({ id, paths: [...paths] });
                continue;
              }
              // CAUTION is its own bucket, not a modifier on compatible/unknown.
              // The caution note already states which files/license, so also
              // listing them under "previously-approved" or "first use" would
              // just be a redundant, confusing duplicate entry.
              if (CAUTION.has(id)) {
                cautionFound.push({ id, paths: [...paths] });
                continue;
              }
              if (INCOMPATIBLE.has(id)) {
                incompatibleFound.push({ id, paths: [...paths] });
                continue;
              }
              const licenseFileName = licenseFileNameFor(id);
              const licenseFileAddedByThisPr = licenseFileName && changedPaths.has(`LICENSES/${licenseFileName}`);
              if (licenseFileName && !licenseFileAddedByThisPr) {
                compatibleFound.push({ id, paths: [...paths] });
              } else {
                unknownFound.push({ id, paths: [...paths] });
              }
            }

            // --- 7. attribute REUSE-spec non_compliant findings to this PR ---
            // The JSON's arrays are NOT uniformly keyed, some are file paths,
            // some are SPDX identifiers scoped to LICENSES/, so each needs its
            // own attribution rule rather than a blind intersection against
            // changedPaths. unused_licenses is repo-wide hygiene only and never
            // attributed/never fails.
            const nc = report.non_compliant;
            const touchesLicenseFileOrIsReferenced = (id) =>
              changedLicenseIds.has(id) || changedFileLicenses.has(id);
            const findings = {
              'missing a copyright line': nc.missing_copyright_info.filter((p) => changedPaths.has(p)),
              'missing SPDX licensing info entirely': nc.missing_licensing_info.filter((p) => changedPaths.has(p)),
              'could not be read by the REUSE tool': nc.read_errors.filter((p) => changedPaths.has(p)),
              'referenced a license with no file in LICENSES/': nc.missing_licenses.filter(touchesLicenseFileOrIsReferenced),
              'used a deprecated SPDX license identifier': nc.deprecated_licenses.filter(touchesLicenseFileOrIsReferenced),
              'has an unrecognized license file in LICENSES/': nc.bad_licenses.filter(touchesLicenseFileOrIsReferenced),
              'has a LICENSES/ file missing its extension': nc.licenses_without_extension.filter(touchesLicenseFileOrIsReferenced),
            };
            const invalidExpressions = [...changedPaths]
              .map((p) => filesByPath.get(p))
              .filter(Boolean)
              .flatMap((f) => f.spdx_expressions
                .filter((e) => !e.is_valid)
                .map((e) => `${f.path} (${e.value})`));
            if (invalidExpressions.length > 0) {
              findings['has a malformed SPDX license expression'] = invalidExpressions;
            }

            const reuseSpecFailed = Object.values(findings).some((arr) => arr.length > 0);
            const licenseCompatFailed = incompatibleFound.length > 0;
            const passed = !reuseSpecFailed && !licenseCompatFailed;
            await setStatus(
              passed ? 'success' : 'failure',
              passed ? 'REUSE Specification compliance check passed' : 'REUSE Specification compliance check failed. See PR comment'
            );

            // --- 7b. draft one-click fixes for missing headers/copyright ---
            // reuse-scan.yml already ran `reuse annotate` with a placeholder
            // identity and uploaded the resulting diff as inert data. Here we
            // substitute the PR's real DCA-certified identity (from its own
            // Signed-off-by trailers) and turn the relevant hunks into GitHub
            // suggested-change review comments. Entirely best-effort: any
            // failure here just means no suggestion is posted, it never
            // affects `passed` or the commit status computed above.
            const IDENTITY_PLACEHOLDER = '@@REUSE_SUGGEST_IDENTITY@@';
            const suggestions = []; // { path, anchorLine, body: string[], inserted: string[] }
            const sidecarFiles = []; // { path, content }
            const fallbackHeaderSuggestions = []; // { path, content }
            const fallbackSuggestionPaths = new Set();
            let postedSuggestionCount = 0;
            let identitySuggestionNotice = null;

            function addFallbackSuggestion(filePath, lines) {
              if (fallbackSuggestionPaths.has(filePath) || lines.length === 0) return;
              fallbackSuggestionPaths.add(filePath);
              fallbackHeaderSuggestions.push({ path: filePath, content: lines.join('\n') });
            }

            function normalizedName(value) {
              return value.trim().replace(/\s+/g, ' ').toLowerCase();
            }

            function normalizedEmail(value) {
              return value.trim().toLowerCase();
            }
            const hasHeaderFindings =
              findings['missing SPDX licensing info entirely'].length > 0 ||
              findings['missing a copyright line'].length > 0;

            if (hasHeaderFindings) {
              // Only use DCA-certified identities: a strict Signed-off-by
              // trailer must match that commit's author or committer. Never
              // invent a copyright holder from a GitHub login. A multi-author
              // PR is intentionally left for manual per-file attribution.
              let identityLine = null;
              try {
                const commits = await github.paginate(github.rest.pulls.listCommits, {
                  owner, repo, pull_number: issue_number, per_page: 100,
                });
                const verifiedIdentities = new Map();
                for (const commit of commits) {
                  if (commit.parents.length > 1) continue;
                  const identities = [commit.commit.author, commit.commit.committer]
                    .filter((identity) => identity?.name && identity?.email);
                  const trailers = [...commit.commit.message.matchAll(
                    /^Signed-off-by:[ \t]*([^<>\r\n]+?)[ \t]*<([^<>\r\n]+)>[ \t]*$/gmi
                  )];
                  for (const trailer of trailers) {
                    const name = trailer[1].trim();
                    const email = trailer[2].trim();
                    const matchesCommit = identities.some((identity) =>
                      normalizedName(name) === normalizedName(identity.name) &&
                      normalizedEmail(email) === normalizedEmail(identity.email)
                    );
                    if (matchesCommit) {
                      verifiedIdentities.set(
                        `${normalizedName(name)}\0${normalizedEmail(email)}`,
                        { name, email },
                      );
                    }
                  }
                }
                if (verifiedIdentities.size === 1) {
                  const [{ name, email }] = verifiedIdentities.values();
                  identityLine = `${new Date().getFullYear()} ${name} <${email}>`;
                } else if (verifiedIdentities.size === 0) {
                  identitySuggestionNotice = 'Header suggestions are withheld until a commit has a matching DCA sign-off.';
                } else {
                  identitySuggestionNotice = 'Header suggestions are withheld because this PR has multiple certified contributor identities; copyright must be attributed per file.';
                }
              } catch (err) {
                core.warning(`Could not resolve a contributor identity for header suggestions: ${err.message}`);
                identitySuggestionNotice = 'Header suggestions could not be generated because the contributor identity could not be verified.';
              }

              // Parses `git diff --cached` output into per-file hunks. Only
              // needs to handle what `reuse annotate` actually produces:
              // pure insertions (no removed lines), so this is intentionally
              // not a general-purpose diff parser.
              function parseAnnotateDiff(text) {
                const files = [];
                for (const block of text.split(/^diff --git /m).slice(1)) {
                  const pathMatch = block.match(/^a\/.+? b\/(.+)$/m);
                  if (!pathMatch) continue;
                  const isNewFile = /^new file mode/m.test(block);
                  const parts = block.split(/^(@@ -\d+(?:,\d+)? \+\d+(?:,\d+)? @@.*)$/m);
                  const hunks = [];
                  for (let i = 1; i < parts.length; i += 2) {
                    const hm = parts[i].match(/^@@ -(\d+)/);
                    let oldLineNo = Number(hm[1]);
                    // The header match doesn't consume its trailing newline,
                    // so the hunk body always starts with one — strip it,
                    // else split() leaves a phantom empty line at index 0
                    // and every anchor line number is off by one.
                    const rawLines = (parts[i + 1] || '').replace(/^\n/, '').split('\n');
                    if (rawLines[rawLines.length - 1] === '') rawLines.pop();
                    const lines = [];
                    for (const raw of rawLines) {
                      if (raw.startsWith('\\')) continue; // "\ No newline at end of file"
                      if (raw.startsWith('+')) lines.push({ type: 'add', text: raw.slice(1) });
                      else if (raw.startsWith('-')) lines.push({ type: 'remove', text: raw.slice(1), oldLineNo: oldLineNo++ });
                      else lines.push({ type: 'context', text: raw.slice(1), oldLineNo: oldLineNo++ });
                    }
                    hunks.push(lines);
                  }
                  files.push({ path: pathMatch[1], isNewFile, hunks });
                }
                return files;
              }

              // A GitHub suggestion replaces an existing line, so inserted
              // text needs one adjacent, untouched context line to anchor
              // on. Only handles a single clean insertion per hunk — any
              // hunk with removals, or more than one add-run, is left for
              // the text-only comment instead of risking a bad suggestion.
              function findInsertion(hunks, identity) {
                if (hunks.length !== 1) return null;
                const lines = hunks[0];
                if (lines.some((l) => l.type === 'remove')) return null;
                const addStart = lines.findIndex((l) => l.type === 'add');
                if (addStart === -1) return null;
                let addEnd = addStart;
                while (addEnd + 1 < lines.length && lines[addEnd + 1].type === 'add') addEnd++;
                if (lines.slice(addEnd + 1).some((l) => l.type === 'add')) return null;
                const addLines = lines.slice(addStart, addEnd + 1)
                  .map((line) => line.text.replaceAll(IDENTITY_PLACEHOLDER, identity));
                const following = lines[addEnd + 1];
                const preceding = lines[addStart - 1];
                if (following && following.type === 'context') {
                  return { anchorLine: following.oldLineNo, body: [...addLines, following.text], inserted: addLines };
                }
                if (preceding && preceding.type === 'context') {
                  return { anchorLine: preceding.oldLineNo, body: [preceding.text, ...addLines], inserted: addLines };
                }
                return null;
              }

              if (identityLine) {
                let annotateDiffText = null;
                try {
                  annotateDiffText = fs.readFileSync(path.join(artifactDir, 'annotate.diff'), 'utf8');
                } catch {
                  // scan.yml may not have produced a diff (nothing to
                  // annotate, or the step failed) — not fatal, just no
                  // suggestions this run.
                }
                if (annotateDiffText) {
                  const excludedPaths = new Set([
                    ...incompatibleFound.flatMap((e) => e.paths),
                    ...findings['could not be read by the REUSE tool'],
                  ]);
                  for (const file of parseAnnotateDiff(annotateDiffText)) {
                    const isSidecar = file.isNewFile && file.path.endsWith('.license');
                    // A sidecar's own path never appears in changedFiles —
                    // it doesn't exist in the real PR — so check the source
                    // file it's standing in for instead.
                    const sourcePath = isSidecar ? file.path.slice(0, -'.license'.length) : file.path;
                    if (!changedPaths.has(sourcePath) || excludedPaths.has(sourcePath)) continue;
                    if (isSidecar) {
                      const content = file.hunks
                        .flatMap((h) => h.filter((l) => l.type === 'add').map((l) => l.text))
                        .join('\n')
                        .replaceAll(IDENTITY_PLACEHOLDER, identityLine);
                      sidecarFiles.push({ path: file.path, content });
                      continue;
                    }
                    const insertedLines = file.hunks
                      .flatMap((hunk) => hunk.filter((line) => line.type === 'add').map((line) => line.text))
                      .map((line) => line.replaceAll(IDENTITY_PLACEHOLDER, identityLine));
                    if (file.isNewFile) {
                      addFallbackSuggestion(file.path, insertedLines);
                      continue;
                    }
                    const insertion = findInsertion(file.hunks, identityLine);
                    if (!insertion) {
                      addFallbackSuggestion(file.path, insertedLines);
                      continue;
                    }
                    suggestions.push({
                      path: file.path,
                      anchorLine: insertion.anchorLine,
                      body: insertion.body,
                      inserted: insertion.inserted,
                    });
                  }
                }
              }

              if (suggestions.length > 0) {
                let existingReviewComments = [];
                try {
                  existingReviewComments = await github.paginate(github.rest.pulls.listReviewComments, {
                    owner, repo, pull_number: issue_number, per_page: 100,
                  });
                } catch (err) {
                  core.warning(`Could not list existing review comments: ${err.message}`);
                }
                const alreadySuggested = new Set(
                  existingReviewComments
                    .filter((c) => isActionsBotComment(c) && c.commit_id === headSha)
                    .map((c) => c.body.match(/<!-- reuse-suggest:([a-f0-9]{64}) -->/))
                    .filter(Boolean)
                    .map((m) => m[1])
                );
                for (const s of suggestions) {
                  const key = suggestionKey(s.path);
                  const suggestionBody = s.body.join('\n');
                  if (alreadySuggested.has(key)) {
                    postedSuggestionCount++;
                    continue;
                  }
                  if (hasSuggestionFenceConflict(suggestionBody)) {
                    addFallbackSuggestion(s.path, s.inserted);
                    continue;
                  }
                  try {
                    await github.rest.pulls.createReviewComment({
                      owner, repo, pull_number: issue_number, commit_id: headSha,
                      path: s.path, line: s.anchorLine, side: 'RIGHT',
                      body: `<!-- reuse-suggest:${key} -->\n\`\`\`suggestion\n${suggestionBody}\n\`\`\``,
                    });
                    postedSuggestionCount++;
                  } catch (err) {
                    core.warning(`Could not post header suggestion for ${s.path}: ${err.message}`);
