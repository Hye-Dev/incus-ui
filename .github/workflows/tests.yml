name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: GitHub workflow tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Tests execute the proposed code with a read-only token and no saved
      # credentials. Do not change this to pull_request_target.
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install REUSE for integration tests
        run: pip install "reuse[charset-normalizer]==6.2.0"

      - name: GitHub Workflow tests
        run: |
          node --test tests/github/*.test.cjs
          python -B -m unittest discover -s tests/github
