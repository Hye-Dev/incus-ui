name: Conventional Commits

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: conventional-commits-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Check commit messages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      # Bootstrap status reporting must work without repository scripts.
      - name: Mark check as pending
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const language = { description: 'Checking every PR commit with commitlint.' };
            const { owner, repo } = context.repo;
            await github.rest.repos.createCommitStatus({
              owner, repo, sha: context.payload.pull_request.head.sha,
              state: 'pending', context: 'Conventional Commits', description: language.description,
              target_url: `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`,
            });

      - name: Check out trusted workflow scripts
        id: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false

      - name: Set up Node.js
        id: setup-node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install commitlint
        id: install
        working-directory: trusted
        run: npm ci --ignore-scripts

      - name: Fetch every PR commit message
        id: fetch-commits
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          COMMITS_FILE: ${{ runner.temp }}/commitlint-commits.json
        with:
          script: |
            await require("./trusted/.github/scripts/commitlint/fetch.cjs")({ github, context, core });

      - name: Lint commit messages
        id: lint
        continue-on-error: true
        env:
          COMMITS_FILE: ${{ runner.temp }}/commitlint-commits.json
        working-directory: trusted
        run: node .github/scripts/commitlint/run.cjs

      - name: Publish commitlint status
        if: always() && steps.checkout.outcome == 'success'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          FETCH_OUTCOME: ${{ steps.fetch-commits.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          SETUP_OUTCOME: ${{ steps.setup-node.outcome }}
        with:
          script: |
            await require("./trusted/.github/scripts/commitlint/status.cjs")({ github, context, core });

      - name: Report checkout failure
        if: always() && steps.checkout.outcome != 'success'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const language = { description: 'Trusted workflow scripts could not be checked out. See the workflow logs.' };
            const { owner, repo } = context.repo;
            await github.rest.repos.createCommitStatus({
              owner, repo, sha: context.payload.pull_request.head.sha,
              state: 'error', context: 'Conventional Commits', description: language.description,
              target_url: `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`,
            });
