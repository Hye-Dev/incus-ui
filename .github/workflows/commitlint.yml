name: Conventional Commits

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: conventional-commits-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Check commit messages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Mark check as pending
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: context.payload.pull_request.head.sha,
              state: 'pending',
              context: 'Conventional Commits',
              description: 'Checking every PR commit with commitlint.',
              target_url: `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`,
            });

      # pull_request_target supplies a write-capable token, so only trusted
      # default-branch code and configuration may be loaded or executed.
      - name: Check out trusted commitlint configuration
        id: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        id: setup-node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install commitlint
        id: install
        run: npm ci --ignore-scripts

      - name: Fetch every PR commit message
        id: fetch-commits
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          COMMITS_FILE: ${{ runner.temp }}/commitlint-commits.json
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            const eventHeadSha = context.payload.pull_request.head.sha;

            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number });
            if (pr.state !== 'open' || pr.head.sha !== eventHeadSha) {
              throw new Error('The PR head changed or the PR closed while commitlint was starting.');
            }

            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner, repo, pull_number, per_page: 100,
            });
            if (pr.commits > 250) {
              throw new Error(`This PR has ${pr.commits} commits, but GitHub exposes at most 250 for verification.`);
            }
            if (commits.length !== pr.commits) {
              throw new Error(`GitHub reported ${pr.commits} commits, but only ${commits.length} could be retrieved.`);
            }

            fs.writeFileSync(
              process.env.COMMITS_FILE,
              JSON.stringify(commits.map((commit) => ({
                sha: commit.sha,
                message: commit.commit.message,
              }))),
              { mode: 0o600 },
            );

      - name: Lint commit messages
        id: lint
        continue-on-error: true
        env:
          COMMITS_FILE: ${{ runner.temp }}/commitlint-commits.json
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { spawnSync } = require('node:child_process');

          const commits = JSON.parse(fs.readFileSync(process.env.COMMITS_FILE, 'utf8'));
          const commitlint = require.resolve('@commitlint/cli/cli.js');
          let failures = 0;

          // Break GitHub workflow-command delimiters in untrusted commit text
          // before printing commitlint output to the runner log.
          function logSafely(value) {
            process.stdout.write(String(value).replaceAll('::', ':\u200b:'));
          }

          for (const commit of commits) {
            const result = spawnSync(
              process.execPath,
              [commitlint, '--config', 'commitlint.config.ts'],
              {
                input: `${commit.message}\n`,
                encoding: 'utf8',
                maxBuffer: 1024 * 1024,
              },
            );

            if (result.error || result.status !== 0) {
              failures++;
              console.log(`Commit ${commit.sha.slice(0, 12)} failed commitlint:`);
              if (result.stdout) logSafely(result.stdout);
              if (result.stderr) logSafely(result.stderr);
              if (result.error) logSafely(`${result.error.message}\n`);
            }
          }

          if (failures > 0) {
            console.error(`${failures} commit message(s) failed commitlint.`);
            process.exitCode = 1;
          } else {
            console.log(`All ${commits.length} commit message(s) passed commitlint.`);
          }
          NODE

      - name: Publish commitlint status
        if: always()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          FETCH_OUTCOME: ${{ steps.fetch-commits.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          SETUP_OUTCOME: ${{ steps.setup-node.outcome }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const headSha = context.payload.pull_request.head.sha;
            const infrastructurePassed = [
              process.env.CHECKOUT_OUTCOME,
              process.env.SETUP_OUTCOME,
              process.env.INSTALL_OUTCOME,
              process.env.FETCH_OUTCOME,
            ].every((outcome) => outcome === 'success');

            let state;
            let description;
            if (!infrastructurePassed) {
              state = 'error';
              description = 'Commitlint could not complete. See the workflow logs.';
            } else if (process.env.LINT_OUTCOME === 'success') {
              state = 'success';
              description = 'All PR commit messages follow Conventional Commits.';
            } else {
              state = 'failure';
              description = 'One or more commit messages failed commitlint.';
            }

            const { data: pr } = await github.rest.pulls.get({
              owner, repo, pull_number: context.payload.pull_request.number,
            });
            if (pr.state !== 'open' || pr.head.sha !== headSha) {
              core.notice('Skipping a stale commitlint result because the PR head changed or the PR closed.');
              return;
            }

            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: headSha,
              state,
              context: 'Conventional Commits',
              description,
              target_url: `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`,
            });

            if (state !== 'success') {
              core.setFailed(description);
            }
